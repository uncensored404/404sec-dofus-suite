<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>404Sec Dofus Suite</title><style>:root{color-scheme:dark;--bg:#0b0f14;--panel:#121922;--line:#263242;--accent:#43d9a3;--text:#e8edf2;--muted:#9aa8b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#172a2a,var(--bg) 45%);font:16px system-ui;color:var(--text)}header{padding:32px max(20px,calc((100% - 960px)/2));border-bottom:1px solid var(--line)}h1{font-size:clamp(28px,5vw,48px);margin:0}h1 span{color:var(--accent)}p,small{color:var(--muted)}main{max-width:960px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}label{display:block;color:var(--muted);margin:12px 0 5px}input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#0b1017;color:var(--text)}button{margin-top:14px;padding:11px 15px;border:0;border-radius:8px;background:var(--accent);font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080c11;border-radius:8px;padding:12px;color:#b7f7da}</style></head><body><header><h1><span>404Sec</span> Dofus Suite</h1><p>Compagnon indépendant : builds, dégâts estimés et progression XP.</p><small>Formules génériques et données d'exemple. Aucun bot ni accès au client de jeu.</small></header><main><section><h2>Estimateur de dégâts</h2><label>Dégâts de base</label><input id="base" type="number" value="100"><label>Puissance</label><input id="power" type="number" value="250"><label>Bonus dégâts (%)</label><input id="percent" type="number" value="20"><label>Bonus fixe</label><input id="flat" type="number" value="12"><label>Résistance (%)</label><input id="resist" type="number" value="15"><button onclick="calcDamage()">Calculer</button><pre id="damageResult">En attente…</pre></section><section><h2>Progression XP</h2><label>XP actuelle</label><input id="current" type="number" value="120000"><label>XP cible</label><input id="target" type="number" value="250000"><button onclick="calcXP()">Calculer</button><pre id="xpResult">En attente…</pre></section><section><h2>Builds exemple</h2><button onclick="loadBuilds()">Charger les builds</button><pre id="buildResult">En attente…</pre></section></main><script>async function post(path,data,out){try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.getElementById(out).textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById(out).textContent=String(e)}}function calcDamage(){post('/api/v1/damage',{base:+base.value,power:+power.value,percent_damage:+percent.value,flat_bonus:+flat.value,resistance_percent:+resist.value},'damageResult')}function calcXP(){post('/api/v1/xp',{current:+current.value,target:+target.value},'xpResult')}async function loadBuilds(){try{let r=await fetch('/api/v1/builds');buildResult.textContent=JSON.stringify(await r.json(),null,2)}catch(e){buildResult.textContent=String(e)}}</script></body></html>
